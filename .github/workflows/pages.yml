name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      content_ref:
        description: Content repository branch, tag, or commit to publish
        required: false
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      COLLECTION_METADATA_DIR: ${{ github.workspace }}/collection/metadata
      SITE_URL: https://veejaliu.github.io/ScienceFictionCollection-Web/
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout reader
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: web
          persist-credentials: false
      - name: Checkout collection metadata only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: VeejaLiu/ScienceFictionCollection
          ref: ${{ inputs.content_ref || 'master' }}
          path: collection
          sparse-checkout: metadata
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: web/.nvmrc
      - name: Install pinned pnpm
        run: npm install --global pnpm@9.15.2
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Build and verify static site
        run: |
          pnpm build:pages
          pnpm check:export
      - name: Record source revisions
        run: |
          echo "Reader: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Collection metadata: $(git -C ../collection rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
